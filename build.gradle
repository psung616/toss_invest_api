plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.12.0'
}

group = 'io.github.psung616'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 공급망 보호: 모든 configuration 의 의존성 버전을 gradle.lockfile 에 고정하고,
// 내려받은 파일은 gradle/verification-metadata.xml 의 sha256 과 대조한다.
// 의존성을 바꾸면:  ./gradlew dependencies --write-locks
//                 ./gradlew --write-verification-metadata sha256 check bootJar
dependencyLocking {
    lockAllConfigurations()
}

ext {
    set('springAiVersion', '2.1.0')
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'
    // Windows 자격 증명 관리자 직접 호출용 (setup 이 키를 OS 자격 증명 저장소에 저장)
    implementation 'net.java.dev.jna:jna:5.19.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

spotless {
    java {
        palantirJavaFormat('2.103.0')
        removeUnusedImports()
    }
}

bootJar {
    archiveFileName = "tossinvest-mcp-${version}.jar"
}

jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live'
    }
}

// ---------------------------------------------------------------------------
// 공식 스펙 다운로드: ./gradlew fetchSpecs → docs/api/ (gitignore 대상, 커밋 금지)
// 토스증권 문서 호스트(openapi.tossinvest.com)만 허용한다. 키·토큰 없이 받는 공개 문서다.
// ---------------------------------------------------------------------------
tasks.register('fetchSpecs') {
    group = 'documentation'
    description = '토스증권 공식 openapi.json / asyncapi.json 을 docs/api/ 로 내려받는다.'
    def outDir = layout.projectDirectory.dir('docs/api')
    def specs = [
        'openapi.json' : 'https://openapi.tossinvest.com/openapi-docs/latest/openapi.json',
        'asyncapi.json': 'https://openapi.tossinvest.com/openapi-docs/latest/asyncapi.json',
    ]
    outputs.dir(outDir)
    outputs.upToDateWhen { false }
    doLast {
        def client = java.net.http.HttpClient.newBuilder()
                .followRedirects(java.net.http.HttpClient.Redirect.NEVER)
                .connectTimeout(java.time.Duration.ofSeconds(10))
                .build()
        def dir = outDir.asFile
        dir.mkdirs()
        specs.each { name, url ->
            def uri = URI.create(url)
            if (uri.scheme != 'https' || uri.host != 'openapi.tossinvest.com') {
                throw new GradleException("허용되지 않은 호스트: ${uri.host}")
            }
            def request = java.net.http.HttpRequest.newBuilder(uri)
                    .timeout(java.time.Duration.ofSeconds(30))
                    .GET()
                    .build()
            def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofByteArray())
            if (response.statusCode() != 200) {
                throw new GradleException("${name} 다운로드 실패: HTTP ${response.statusCode()}")
            }
            new File(dir, name).bytes = response.body()
            logger.lifecycle("docs/api/${name} (${response.body().length} bytes)")
        }
    }
}

// ---------------------------------------------------------------------------
// 배포 패키징: JDK 설치 없이 실행되는 앱 이미지(jpackage) + Claude Desktop 원클릭 확장(.mcpb)
//   ./gradlew mcpb  →  build/mcpb/tossinvest-mcp-<버전>-<os>.mcpb
// jpackage 는 크로스 빌드가 안 되므로 각 OS 에서 따로 빌드한다 (현재 manifest 는 win32 만 선언).
// ---------------------------------------------------------------------------
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def appVersion = version.toString().replace('-SNAPSHOT', '')
def jpackageDir = layout.buildDirectory.dir('jpackage')

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Java 런타임을 포함한 실행 파일 폴더를 만든다 (build/jpackage/tossinvest-mcp).'
    dependsOn tasks.named('bootJar')

    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def jarFile = tasks.named('bootJar').flatMap { it.archiveFile }

    inputs.file(jarFile)
    outputs.dir(jpackageDir)

    doFirst {
        delete jpackageDir
        def jdkHome = launcher.get().metadata.installationPath.asFile
        executable new File(jdkHome, isWindows ? 'bin/jpackage.exe' : 'bin/jpackage')
        def jar = jarFile.get().asFile
        def cmd = [
            '--type', 'app-image',
            '--name', 'tossinvest-mcp',
            '--app-version', appVersion,
            '--vendor', 'psung616',
            '--input', jar.parentFile.absolutePath,
            '--main-jar', jar.name,
            '--dest', jpackageDir.get().asFile.absolutePath,
        ]
        // stdio(MCP) 통신과 터미널 setup 을 위해 콘솔 실행 파일로 만든다.
        if (isWindows) {
            cmd += '--win-console'
        }
        args cmd
    }
}

tasks.register('mcpb', Zip) {
    group = 'distribution'
    description = 'Claude Desktop 원클릭 확장 파일(.mcpb)을 만든다.'
    dependsOn tasks.named('jpackageImage')

    def osTag = isWindows ? 'win32' : System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin' : 'linux'
    archiveFileName = "tossinvest-mcp-${version}-${osTag}.mcpb"
    destinationDirectory = layout.buildDirectory.dir('mcpb')

    from('packaging/mcpb') {
        include 'manifest.json'
        filter { line -> line.replace('@VERSION@', appVersion) }
    }
    from('packaging/mcpb') {
        include 'icon.png'
    }
    from(jpackageDir) {
        into 'server'
    }
}
